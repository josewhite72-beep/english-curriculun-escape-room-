<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1510">
    <title>Sala 1 · Fuga de Aula | PanaMentorLabs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: #1a1510;
            overflow-x: hidden;
            position: relative;
        }

        /* Mapa de fondo fijo */
        .mapa-fondo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            overflow: hidden;
        }

        .mapa-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        /* Header */
        .header {
            position: relative;
            z-index: 10;
            background: linear-gradient(180deg, rgba(26, 21, 16, 0.95) 0%, rgba(26, 21, 16, 0.85) 100%);
            padding: 16px 20px;
            border-bottom: 3px solid rgba(139, 115, 85, 0.5);
        }

        .volver-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #fbbf24;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .volver-btn:active {
            opacity: 0.7;
        }

        .logo {
            font-size: 0.85rem;
            color: #d4b896;
            letter-spacing: 3px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .titulo-sala {
            font-size: 1.8rem;
            color: #fff;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .info-equipo {
            font-size: 0.95rem;
            color: #d4b896;
        }

        /* Barra de progreso */
        .barra-progreso {
            position: relative;
            z-index: 10;
            background: rgba(26, 21, 16, 0.9);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid rgba(139, 115, 85, 0.3);
        }

        .candados-container {
            display: flex;
            gap: 12px;
        }

        .candado {
            width: 48px;
            height: 48px;
            background: rgba(139, 115, 85, 0.3);
            border: 3px solid rgba(139, 115, 85, 0.6);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.3s ease;
        }

        .candado.activo {
            background: rgba(251, 191, 36, 0.3);
            border-color: #fbbf24;
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.5);
        }

        .candado.completado {
            background: rgba(74, 222, 128, 0.3);
            border-color: #4ade80;
        }

        .llaves-counter {
            background: rgba(139, 115, 85, 0.4);
            border: 2px solid rgba(139, 115, 85, 0.6);
            border-radius: 20px;
            padding: 8px 16px;
            color: #fbbf24;
            font-weight: bold;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Contenedor del ejercicio */
        .contenedor-ejercicio {
            position: relative;
            z-index: 5;
            min-height: calc(100vh - 200px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ENFOQUE PASTILLAS */
        .ejercicio-pastillas {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 420px;
        }

        .pastilla {
            background: rgba(255, 253, 240, 0.95);
            border: 3px solid #8b7355;
            border-radius: 16px;
            padding: 18px 22px;
            box-shadow: 
                0 6px 20px rgba(0, 0, 0, 0.35),
                inset 0 0 0 1px rgba(255, 255, 255, 0.3);
        }

        .pastilla-titulo {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.95), rgba(245, 158, 11, 0.95));
            border-color: #d97706;
            text-align: center;
        }

        .pastilla-titulo h2 {
            color: #1a1510;
            font-size: 1.6rem;
            font-weight: bold;
            margin-bottom: 6px;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
        }

        .pastilla-titulo .candado-info {
            color: #78350f;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .pastilla-tipo {
            background: rgba(139, 115, 85, 0.9);
            border-color: #6b5345;
            padding: 12px 22px;
        }

        .pastilla-tipo span {
            color: #fbbf24;
            font-size: 0.95rem;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .pastilla-pregunta {
            background: rgba(255, 253, 240, 0.92);
        }

        .pastilla-pregunta p {
            color: #1a1510;
            font-size: 1.2rem;
            line-height: 1.5;
            font-weight: 500;
        }

        .pastilla-accion {
            background: linear-gradient(135deg, #8b7355, #6b5345);
            border-color: #4a3728;
            padding: 0;
            overflow: hidden;
        }

        .pastilla-accion button {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 16px 24px;
            width: 100%;
            cursor: pointer;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .pastilla-accion button:active {
            transform: scale(0.98);
        }

        .pastilla-opcion {
            background: rgba(255, 255, 255, 0.97);
            padding: 0;
            cursor: pointer;
            overflow: hidden;
        }

        .pastilla-opcion button {
            background: none;
            border: none;
            color: #1a1510;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 16px 24px;
            width: 100%;
            cursor: pointer;
            text-align: left;
        }

        .pastilla-opcion:active {
            transform: scale(0.98);
        }

        .pastilla-opcion.correcta {
            background: rgba(74, 222, 128, 0.95);
            border-color: #16a34a;
        }

        .pastilla-opcion.incorrecta {
            background: rgba(239, 68, 68, 0.95);
            border-color: #dc2626;
        }

        .loading {
            text-align: center;
            color: #d4b896;
            font-size: 1.2rem;
            padding: 40px 20px;
        }

        @media (max-width: 480px) {
            .titulo-sala { font-size: 1.5rem; }
            .pastilla-titulo h2 { font-size: 1.4rem; }
            .pastilla-pregunta p { font-size: 1.1rem; }
            .pastilla-opcion button { font-size: 1.1rem; }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pastilla {
            animation: slideIn 0.4s ease forwards;
            opacity: 0;
        }

        .pastilla:nth-child(1) { animation-delay: 0.1s; }
        .pastilla:nth-child(2) { animation-delay: 0.2s; }
        .pastilla:nth-child(3) { animation-delay: 0.3s; }
        .pastilla:nth-child(4) { animation-delay: 0.4s; }
        .pastilla:nth-child(5) { animation-delay: 0.5s; }
        .pastilla:nth-child(6) { animation-delay: 0.6s; }
        .pastilla:nth-child(7) { animation-delay: 0.7s; }
    </style>
</head>
<body>
    <div class="mapa-fondo">
        <img src="mapa-tesoro-vertical.png" alt="Mapa del tesoro" class="mapa-img">
    </div>

    <header class="header">
        <a href="index.html" class="volver-btn">← Volver al mapa</a>
        <div class="logo">PANAMENTORLABS</div>
        <h1 class="titulo-sala">Sala 1</h1>
        <div class="info-equipo">Equipo 1 · CEFR Pre A1.3</div>
    </header>

    <div class="barra-progreso">
        <div class="candados-container">
            <div class="candado activo" data-candado="1">🔒</div>
            <div class="candado" data-candado="2"></div>
            <div class="candado" data-candado="3"></div>
        </div>
        <div class="llaves-counter">
            <span>🔑</span>
            <span id="llaves-count">0/8</span>
        </div>
    </div>

    <main class="contenedor-ejercicio">
        <div class="ejercicio-pastillas" id="ejercicio-container">
            <div class="loading">Cargando…</div>
        </div>
    </main>

    <script>
        const ejercicioData = {
            titulo: "Today Is Tuesday!",
            candado: "1/3",
            tipo: "LISTENING",
            pregunta: "Escucha el audio y responde: ¿qué día es hoy?",
            audioUrl: "audio/martes.mp3",
            opciones: ["Tuesday", "Monday", "Friday"],
            respuestaCorrecta: 0
        };

        function renderizarEjercicio(data) {
            const container = document.getElementById('ejercicio-container');
            
            container.innerHTML = `
                <div class="pastilla pastilla-titulo">
                    <h2>${data.titulo}</h2>
                    <div class="candado-info">Candado ${data.candado}</div>
                </div>

                <div class="pastilla pastilla-tipo">
                    <span>${data.tipo}</span>
                </div>

                <div class="pastilla pastilla-pregunta">
                    <p>${data.pregunta}</p>
                </div>

                <div class="pastilla pastilla-accion">
                    <button id="btn-escuchar" onclick="reproducirAudio()">
                        <span>▶</span>
                        <span>Escuchar</span>
                    </button>
                </div>

                ${data.opciones.map((opcion, index) => `
                    <div class="pastilla pastilla-opcion" data-opcion="${index}">
                        <button onclick="seleccionarOpcion(${index})">${opcion}</button>
                    </div>
                `).join('')}
            `;
        }

        function reproducirAudio() {
            const audio = new Audio(ejercicioData.audioUrl);
            audio.play().catch(err => {
                console.error('Error:', err);
                alert('No se pudo reproducir el audio');
            });
        }

        function seleccionarOpcion(index) {
            const opciones = document.querySelectorAll('.pastilla-opcion');
            opciones.forEach(op => op.classList.remove('correcta', 'incorrecta'));

            if (index === ejercicioData.respuestaCorrecta) {
                opciones[index].classList.add('correcta');
                setTimeout(() => alert('¡Correcto! 🎉'), 300);
            } else {
                opciones[index].classList.add('incorrecta');
                setTimeout(() => alert('Intenta de nuevo 💪'), 300);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => renderizarEjercicio(ejercicioData), 500);
        });
    </script>
</body>
</html>
