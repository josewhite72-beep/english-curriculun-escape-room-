<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141B2E">
<title>Modo Proyector · Fuga de Aula | PanaMentorLabs</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141B2E; --panel:#1E2B47; --panel-2:#243456;
    --ink:#F2EFE3; --ink-dim:#B8C0D6;
    --brass:#CC9F3F; --brass-dim:#8A6F32;
    --teal:#3FA796; --coral:#E4572E;
    --line:rgba(242,239,227,0.14); --radius:18px;
    --font-display:'Baloo 2', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'Space Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(204,159,63,0.10), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(63,167,150,0.10), transparent 45%),
      var(--bg);
    color:var(--ink); font-family:var(--font-body); min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  :focus-visible{outline:2px solid var(--teal); outline-offset:3px;}
  button{font-family:inherit; cursor:pointer;}

  .wrap{max-width:1100px; margin:0 auto; padding:28px 24px 60px;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;
  }
  .backlink{color:var(--brass); font-size:14px; text-decoration:none;}
  .actions{display:flex; gap:10px;}
  .ghost-btn{
    background:none; border:1px solid var(--line); color:var(--ink-dim);
    font-size:13px; padding:9px 14px; border-radius:9px;
  }
  .ghost-btn:hover{border-color:var(--teal); color:var(--teal);}

  .head{text-align:center; margin:14px 0 32px;}
  .brand{font-family:var(--font-mono); font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--brass);}
  .title{font-family:var(--font-display); font-weight:800; font-size:clamp(30px,5vw,46px); margin:6px 0 4px;}
  .live{
    display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-dim);
    margin-top:6px;
  }
  .live .dot{
    width:8px; height:8px; border-radius:50%; background:var(--teal);
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1; box-shadow:0 0 0 0 rgba(63,167,150,.5);}
    50%{opacity:.6; box-shadow:0 0 0 6px rgba(63,167,150,0);}
  }
  @media (prefers-reduced-motion: reduce){ .live .dot{animation:none;} }

  .empty{
    text-align:center; padding:60px 20px; color:var(--ink-dim); font-size:16px;
  }

  .board{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:18px;
  }
  .team-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px; position:relative; overflow:hidden;
  }
  .team-card.leader{border-color:var(--brass);}
  .team-card.complete{border-color:var(--teal);}
  .rank{
    position:absolute; top:14px; right:16px; font-size:26px;
  }
  .team-name{
    font-family:var(--font-display); font-weight:700; font-size:21px; margin:0 0 2px; padding-right:36px;
  }
  .team-meta{font-size:12px; color:var(--ink-dim); margin:0 0 16px;}
  .bar-track{
    height:12px; border-radius:8px; background:var(--panel-2); overflow:hidden; margin-bottom:8px;
  }
  .bar-fill{
    height:100%; background:linear-gradient(90deg, var(--brass), var(--teal));
    border-radius:8px; transition:width .5s ease;
  }
  .bar-label{
    display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:12px; color:var(--ink-dim);
  }
  .team-code{
    margin-top:14px; padding-top:12px; border-top:1px dashed var(--line);
    font-family:var(--font-mono); font-size:15px; color:var(--teal); text-align:center;
    letter-spacing:.08em;
  }
  .team-code .lbl{display:block; font-size:10px; color:var(--ink-dim); letter-spacing:.1em; text-transform:uppercase; margin-bottom:4px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="backlink" href="index.html">← Volver al mapa</a>
    <div class="actions">
      <button class="ghost-btn" id="fsBtn">Pantalla completa</button>
    </div>
  </div>

  <div class="head">
    <div class="brand">PanaMentorLabs</div>
    <h1 class="title">Modo Proyector</h1>
    <div class="live"><span class="dot"></span> Actualizando en vivo</div>
  </div>

  <div id="content"></div>
</div>

<script>
(function(){
  "use strict";

  var TOTAL_ESTACIONES = 8; // 4 salas x 2 estaciones, fijo para todos los grados
  var salaMetaCache = {}; // { grado: [ {estIds:[..], codigoEstacion}, ... ] }

  var content = document.getElementById('content');

  function fmtElapsed(startMs){
    var s = Math.max(0, Math.floor((Date.now() - startMs) / 1000));
    var m = Math.floor(s / 60);
    var ss = s % 60;
    return m + ':' + (ss < 10 ? '0' : '') + ss;
  }

  function collectTeams(){
    var teams = [];
    for(var i = 0; i < localStorage.length; i++){
      var k = localStorage.key(i);
      if(k && k.indexOf('fuga_estado_g') === 0){
        try{
          var state = JSON.parse(localStorage.getItem(k));
          if(state && state.equipo){
            state._key = k;
            teams.push(state);
          }
        }catch(e){ /* ignorar entradas corruptas */ }
      }
    }
    return teams;
  }

  function ensureSalaMeta(grado, cb){
    if(salaMetaCache[grado]){ cb(salaMetaCache[grado]); return; }
    Promise.all([1,2,3,4].map(function(n){
      return fetch('data/grado' + grado + '_s' + n + '.json')
        .then(function(r){ return r.ok ? r.json() : null; })
        .catch(function(){ return null; });
    })).then(function(results){
      salaMetaCache[grado] = results.filter(Boolean);
      cb(salaMetaCache[grado]);
    });
  }

  function masterCodeFor(state, salas){
    if(!salas || !salas.length) return null;
    return salas.map(function(s){ return s.codigoEstacion; }).join('-');
  }

  function render(){
    var teams = collectTeams();
    if(teams.length === 0){
      content.innerHTML = '<p class="empty">Aún no hay equipos jugando en este dispositivo.<br>El progreso aparecerá aquí en cuanto un equipo entre a una sala.</p>';
      return;
    }

    var grados = {};
    teams.forEach(function(t){ grados[t.grado] = true; });
    var gradosList = Object.keys(grados);

    Promise.all(gradosList.map(function(g){
      return new Promise(function(resolve){ ensureSalaMeta(g, resolve); });
    })).then(function(){
      teams.forEach(function(t){
        var comp = t.estacionesCompletadas || {};
        t._done = Object.keys(comp).filter(function(id){ return comp[id]; }).length;
        t._pct = Math.round((t._done / TOTAL_ESTACIONES) * 100);
        t._complete = t._done >= TOTAL_ESTACIONES;
        t._code = t._complete ? masterCodeFor(t, salaMetaCache[t.grado]) : null;
      });
      teams.sort(function(a, b){ return b._done - a._done; });

      var html = '<div class="board">';
      teams.forEach(function(t, i){
        var rankIcon = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '';
        var cls = 'team-card' + (t._complete ? ' complete' : (i === 0 ? ' leader' : ''));
        html += '<div class="' + cls + '">';
        if(rankIcon) html += '<div class="rank">' + rankIcon + '</div>';
        html += '<h2 class="team-name">' + t.equipo + '</h2>';
        html += '<p class="team-meta">Grado ' + t.grado + ' · ' + fmtElapsed(t.tiempoInicio || Date.now()) + '</p>';
        html += '<div class="bar-track"><div class="bar-fill" style="width:' + t._pct + '%"></div></div>';
        html += '<div class="bar-label"><span>' + t._done + '/' + TOTAL_ESTACIONES + ' estaciones</span><span>' + t._pct + '%</span></div>';
        if(t._complete && t._code){
          html += '<div class="team-code"><span class="lbl">Código maestro</span>' + t._code + '</div>';
        }
        html += '</div>';
      });
      html += '</div>';
      content.innerHTML = html;
    });
  }

  render();
  window.addEventListener('storage', render);
  setInterval(render, 5000);

  document.getElementById('fsBtn').addEventListener('click', function(){
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(function(){});
    } else {
      document.exitFullscreen();
    }
  });

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
</body>
</html>
